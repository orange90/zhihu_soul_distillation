<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>知识蒸馏馆</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <div class="header">
        <span class="logo">🧪</span>
        <span class="brand">知识蒸馏馆</span>
      </div>
      <p class="hint">
        登录
        <a id="openApp" href="#">zhihusoul.cn</a>
        后点页面上的「一键写入插件」即可完成配置；然后到自己的知乎主页一键勾选 / 批量抓取回答。
      </p>

      <div class="kv">
        <span class="kv-k">后端</span>
        <span class="kv-v mono" id="apiBaseShow">https://zhihusoul.cn</span>
      </div>
      <div class="kv">
        <span class="kv-k">Token</span>
        <span class="kv-v mono" id="tokenShow">（未配置）</span>
      </div>

      <section>
        <button id="ping" class="btn primary">校验登录态</button>
        <button id="open-app" class="btn ghost">打开蒸馏馆</button>
      </section>

      <details class="advanced">
        <summary>高级 / 手动配置</summary>
        <p class="hint" style="margin-top:8px">
          仅在你无法用「一键写入」时使用——粘贴在网页端「获取插件 Token」拿到的 Token：
        </p>
        <textarea
          id="token"
          class="input mono"
          rows="3"
          placeholder="Bearer token..."
        ></textarea>
        <button id="save" class="btn">保存 Token</button>
      </details>

      <div id="status" class="status"></div>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
