<style>
  :root{
    --paper:#fffaf2; --ink:#2a2118; --brown:#7a4a1e; --gold:#c8861a; --gold-d:#a96a0e;
    --red:#c0392b; --green:#1f8a4c; --line:#e8dcc6; --shadow:rgba(80,50,10,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}

  img#cardImg{width:100%;border-radius:16px;box-shadow:0 8px 22px var(--shadow);display:block;margin-top:6px;background:#fff;

  .hidden{display:none!important;}
</style>

<script>
"use strict";

/* ============================================================
   鸭骗战争 —— 独立单页小游戏
   - 题库 / 成就 / 计分 / 分享卡片(canvas) 全部内联，自包含
   - 可选复用本项目已部署的知乎 OAuth：/api/auth/me、/api/auth/login
   - 图片均为本地图（public/goose-duck/ 下），加载失败回退 emoji
   ============================================================ */

/* ---------- 图片来源（本地图，放在 public/goose-duck/ 下） ----------
   如需替换为更合适的图，覆盖对应文件或改下面文件名即可。 */
const IMG = {
  duckSide:  "duck-side.jpg",                   // 鸭·侧面（绿头鸭，本地图）
  gooseSide: "goose-side.jpg",                  // 鹅·侧面（家鹅，本地图）
  duckBack:  "duck-back.svg",                   // 鸭·轮廓剪影（自绘，主体黑/背景白，契合「凭轮廓判断」）
  gooseBack: "goose-back.svg",                  // 鹅·轮廓剪影（自绘，主体黑/背景白）
  roastGoose: "roast-goose.jpg",               // 烤味（菜品，本地图）
  // 陷阱题四宫格：真实烤鸭腿照片 leg1.jpg~leg4.jpg（放到 public/goose-duck/ 即生效），缺图回退 emoji。
};

/* ---------- 二维码 ----------
   把你的二维码图片放到  public/goose-duck/qrcode.png  即自动显示在成就卡上；
   没有该文件时，卡片显示「二维码 / 敬请期待」留白框。换图无需改代码。 */
const qrImg = new Image();
let qrReady = false;
qrImg.onload = () => { qrReady = !!qrImg.naturalWidth; if (typeof _cardReady !== "undefined" && _cardReady) drawCard(state.correct, ACHIEVEMENTS[state.correct]); };
qrImg.onerror = () => { qrReady = false; };
qrImg.src = "qrcode.png"; // 相对路径 → /goose-duck/qrcode.png（同源，不污染画布）

/* ---------- 题库（共 10 题） ---------- */
const QUESTIONS = [
  // —— 4 道文字题 ——
  { type:"text", tag:"文字题 · 时事",
    q:"「鹅腿阿姨」事件里，阿姨最终承认，卖了多年的「鹅腿」其实是什么？",
    options:["鸭腿","鹅腿","鸡腿","鸵鸟腿"], answer:0,
    why:"2024 年 6 月，阿姨公开承认日常售卖的烤腿原材料其实是<b>鸭腿</b>。清北学子被「鹅」了好几年。" },
  { type:"text", tag:"文字题 · 外形",
    q:"和鸭子相比，鹅最直观的外形区别是？",
    options:["体型更大、脖子更长","体型更小、脖子更短","羽毛颜色更鲜艳","完全没有脚蹼"], answer:0,
    why:"鹅普遍<b>体型更大、脖子更长</b>，站姿更挺拔；鸭子矮胖、脖子短。" },
  { type:"text", tag:"文字题 · 细节",
    q:"下面哪个特征常见于鹅，而普通鸭子一般没有？",
    options:["额头/喙根部有肉瘤（隆起）","身上有羽毛","脚上有脚蹼","会在水里游泳"], answer:0,
    why:"很多鹅（如中国鹅/狮头鹅）<b>喙根部有明显肉瘤</b>，这是鸭子通常没有的辨识点。" },
  { type:"text", tag:"文字题 · 口感",
    q:"论口感，鹅肉和鸭肉相比通常更……？",
    options:["纤维更粗、更有嚼劲，味道更「野」","完全一模一样吃不出","鹅肉是甜的","鸭肉没有骨头"], answer:0,
    why:"鹅肉颜色更深、<b>纤维更粗更有嚼劲</b>，风味更浓郁；鸭肉相对细嫩。——所以理论上是能吃出来的。" },

  // —— 4 道动物分辨图（含鸭背影 / 鹅背影） ——
  { type:"animal", tag:"看图鉴定 · 动物", img:IMG.duckSide, emoji:"🦆",
    q:"看这只水里的鸟，是鹅还是鸭？", options:["鹅","鸭"], answer:1,
    why:"绿头、矮身、短脖——这是<b>鸭</b>（绿头鸭）。" },
  { type:"animal", tag:"看图鉴定 · 动物", img:IMG.gooseSide, emoji:"🦢",
    q:"这一只呢？是鹅还是鸭？", options:["鹅","鸭"], answer:0,
    why:"长脖子、体型大、挺拔——这是<b>鹅</b>。" },
  { type:"animal", tag:"看图鉴定 · 轮廓", img:IMG.duckBack, emoji:"🦆", credit:"轮廓示意图",
    q:"只给你一个轮廓，凭外形判断：鹅还是鸭？", options:["鹅","鸭"], answer:1,
    why:"矮胖紧凑、脖子短，是<b>鸭</b>。只看轮廓最容易看走眼，阿姨就靠这个。" },
  { type:"animal", tag:"看图鉴定 · 轮廓", img:IMG.gooseBack, emoji:"🦢", credit:"轮廓示意图",
    q:"再来一个轮廓，鹅还是鸭？", options:["鹅","鸭"], answer:0,
    why:"个头大、脖子长、挺拔，是<b>鹅</b>。" },

  // —— 菜品分辨图 ——
  { type:"dish", tag:"看图鉴定 · 菜品", img:IMG.roastGoose, emoji:"🍖",
    q:"上菜了！这盘油亮的烤味，是鹅肉还是鸭肉？", options:["鹅肉","鸭肉"], answer:0,
    why:"这是港式<b>烧鹅</b>——块头大、皮色深红油亮。鹅肉无误。" },

  // —— 第 10 题：陷阱题（不告诉用户） ——
  { type:"trap", tag:"最后一题 · 现场鉴定", emoji:"🍗", credit:"",
    q:"摊位上这几只烤腿，点选出所有「鹅腿」（0–4 张）。",
    why:"" }, // 陷阱：四只全是鸭腿，正确答案是「一张都不选」。揭晓文案在结果页统一处理。
];

/* ---------- 选项乱序：避免正确答案总是 A（陷阱题数字选项保持 0..4 顺序） ---------- */
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildQuiz() {
  return QUESTIONS.map(q => {
    if (q.type === "trap") return Object.assign({}, q);   // 数字选项需保持顺序
    const order = shuffleArr(q.options.map((_, i) => i));
    return Object.assign({}, q, {
      options: order.map(i => q.options[i]),
      answer: order.indexOf(q.answer),
    });
  });
}

/* ---------- 成就体系（0–10，逐字保留用户文案） ---------- */
const ACHIEVEMENTS = [
  { t:"清北学生", d:"三年了，你是一点没吃出来啊。", lbl:"称号说明：", f:["鹅鸭识别能力：0%","骗子最爱的客户","阿姨VIP会员"] },
  { t:"鹅腿信徒", d:"阿姨说是鹅，那一定是鹅。", lbl:"特点：", f:["从不质疑","从不观察","从不思考"] },
  { t:"鸭骗受害者", d:"隐约感觉不对，但还是买了。", lbl:"特点：", f:["有怀疑","没证据","最后认输"] },

  { t:"半鹅半鸭研究员", d:"你已经超过了全国 50% 的网友。", lbl:"特点：", f:["基础知识掌握","偶尔被烤腿迷惑"] },
  { t:"鹅腿打假先锋", d:"开始质疑世界。", lbl:"特点：", f:["会看体型","会看嘴型","会看脚蹼"] },
  { t:"鹅学硕士", d:"你已经有资格在校门口摆摊了。", lbl:"特点：", f:["大部分情况都能认出来"] },
  { t:"鸭子克星", d:"鸭子看到你都会紧张。", lbl:"特点：", f:["识别准确率极高","不容易被骗"] },
  { t:"鹅腿阿姨天敌", d:"阿姨看到你立刻收摊。", lbl:"特点：", f:["肉眼鉴鹅","火眼金睛"] },
  { t:"鹅学大师", d:"真鹅假鸭，皆逃不过你的双眼。", lbl:"特点：", f:["满分鉴定，无一失手","建议直接去摆摊打假"] },

/* ---------- 状态 ---------- */
const state = {
  idx: 0,
  correct: 0,
  answered: false,
  results: [],          // 每题是否答对
  user: null,           // { name, avatar_url }
  quiz: [],             // 本局题目（选项已乱序）
  trapPick: null,       // 陷阱题已选中的图片下标集合
};

const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);

/* ---------- 工具：带 emoji 回退的图片 ---------- */
function imgWithFallback(src, emoji, cls) {
  const wrap = document.createElement("div");
  wrap.className = cls;
  const im = document.createElement("img");
  im.src = src;
  im.alt = "";
  im.referrerPolicy = "no-referrer";
  im.onerror = () => {
    const ph = document.createElement("div");
    ph.className = "emoji-ph";
    ph.textContent = emoji;
    im.replaceWith(ph);
  };
  wrap.appendChild(im);
  return wrap;
}

/* 陷阱题单格：真实烤鸭腿照片 legN.jpg → emoji，不再回退自绘 svg 示意图 */
function legCell(n) {
  const wrap = document.createElement("div");
  wrap.className = "leg";
  const im = document.createElement("img");
  im.alt = "";
  im.referrerPolicy = "no-referrer";
  im.onerror = () => {
    const ph = document.createElement("div");
    ph.className = "emoji-ph"; ph.textContent = "🍗";
    im.replaceWith(ph);
  };
  im.src = "leg" + n + ".jpg";   // 真实照片：放到 public/goose-duck/ 即自动启用
  wrap.appendChild(im);
  return wrap;
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("show"), 1900);
}

/* ============================================================
   屏幕：答题
   ============================================================ */
function renderQuestion() {
  state.answered = false;
  const q = state.quiz[state.idx];
  const total = state.quiz.length;
  const pct = Math.round((state.idx) / total * 100);

  const el = document.createElement("div");
  el.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-top"><span>第 ${state.idx + 1} / ${total} 题</span><span>已答对 ${state.correct}</span></div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </div>
    <span class="qtag">${q.tag}</span>
    <h2 class="qtitle">${q.q}</h2>
    <div id="media"></div>
    <div id="opts"></div>
    <div id="fb"></div>
    <div class="next-row hidden" id="nextRow">
      <button class="btn btn-primary" id="nextBtn">${state.idx === total - 1 ? "看结果 🏆" : "下一题 →"}</button>
    </div>
  `;
  app.innerHTML = "";
  app.appendChild(el);

  // 媒体区
  const media = $("media");
  const creditText = (q.credit !== undefined) ? q.credit : "图片来源：Wikimedia Commons (CC)";
  const addCredit = () => {
    if (!creditText) return;
    const c = document.createElement("div"); c.className = "qcredit"; c.textContent = creditText;
    media.appendChild(c);
  };
  if (q.type === "animal" || q.type === "dish") {
    media.appendChild(imgWithFallback(q.img, q.emoji, "qimg"));
    addCredit();
  } else if (q.type === "trap") {
    // 多选图：点选所有「鹅腿」（其实全是鸭腿，正确做法是一张都不选）
    const grid = document.createElement("div"); grid.className = "leg-grid select";
    state.trapPick = new Set();
    for (let i = 1; i <= 4; i++) {
      const cell = legCell(i);
      cell.onclick = () => {
        if (state.answered) return;
        const on = cell.classList.toggle("sel");
        if (on) state.trapPick.add(i); else state.trapPick.delete(i);
      };
      grid.appendChild(cell);
    }
    media.appendChild(grid);
    addCredit();
  }

  // 选项
  const opts = $("opts");
  if (q.type === "trap") {
    // 陷阱题用「确认选择」按钮提交（允许不选）
    opts.className = "options";
    const btn = document.createElement("button");
    btn.className = "btn btn-primary"; btn.id = "trapConfirm"; btn.style.width = "100%";
    btn.textContent = "确认选择";
    btn.onclick = confirmTrap;
    opts.appendChild(btn);
  } else {
    let cls = "options";
    if (q.type === "animal" || q.type === "dish") cls += " two";
    opts.className = cls;
    q.options.forEach((label, i) => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span>${label}</span>`;
      b.onclick = () => choose(i, b);
      opts.appendChild(b);
    });
  }
  // scroll to top
  document.querySelector(".scroll").scrollTop = 0;
}

function choose(i, btn) {
  if (state.answered) return;
  state.answered = true;
  const q = state.quiz[state.idx];
  const correct = i === q.answer;
  state.results[state.idx] = correct;
  if (correct) state.correct++;

  // 标记按钮
  const buttons = Array.from(document.querySelectorAll("#opts .opt"));
  buttons.forEach((b, bi) => {
    b.onclick = null;
    if (bi === q.answer) { b.classList.add("correct"); b.insertAdjacentHTML("beforeend", `<span class="ic">✓</span>`); }
    if (bi === i && !correct) { b.classList.add("wrong"); b.insertAdjacentHTML("beforeend", `<span class="ic">✗</span>`); }
    if (bi !== q.answer && bi !== i) b.classList.add("dim");
  });

  // 反馈
  const fb = $("fb");
  if (q.type === "trap") {
    // 陷阱题：保持悬念，不直接点破，只给中性反馈
    fb.className = "feedback " + (correct ? "ok" : "no");
    fb.innerHTML = correct
      ? `<b>有点东西。</b>你顶住了「鹅」的心理暗示。至于为什么——结果页揭晓。`
      : `<b>记下了。</b>你数出了「鹅腿」。到底有几个？结果页见分晓。`;
  } else {
    fb.className = "feedback " + (correct ? "ok" : "no");
    fb.innerHTML = (correct ? "✅ 答对了！ " : "❌ 答错了。 ") + q.why;
  }

  $("nextRow").classList.remove("hidden");
  $("nextBtn").onclick = () => {
    if (state.idx === QUESTIONS.length - 1) renderResult();
    else { state.idx++; renderQuestion(); }
  };
  document.querySelector(".scroll").scrollTop = document.querySelector(".scroll").scrollHeight;
}

/* 陷阱题提交：四张全是鸭腿，没有鹅腿 → 只有「一张都不选」才算对 */
function confirmTrap() {
  if (state.answered) return;
  state.answered = true;
  const correct = state.trapPick.size === 0;
  state.results[state.idx] = correct;
  if (correct) state.correct++;

  // 揭示：所有图都标「鸭腿」；被误选成「鹅腿」的标红
  Array.from(document.querySelectorAll("#media .leg")).forEach(cell => {
    cell.onclick = null;
    cell.classList.add("done");
    const picked = cell.classList.contains("sel");
    if (picked) cell.classList.add("bad");
    const tag = document.createElement("div");
    tag.className = "legtag" + (picked ? " bad" : "");
    tag.textContent = picked ? "其实是鸭腿" : "鸭腿";
    cell.appendChild(tag);
  });

  const cb = $("trapConfirm"); if (cb) { cb.disabled = true; cb.classList.add("hidden"); }

  // 反馈（保持悬念，结果页揭晓）
  const fb = $("fb");
  fb.className = "feedback " + (correct ? "ok" : "no");
  fb.innerHTML = correct
    ? `<b>有点东西。</b>你一个「鹅腿」都没选——顶住了「鹅」的心理暗示。为什么？结果页揭晓。`
    : `<b>记下了。</b>你把鸭腿当成了「鹅腿」。到底有几个鹅腿？结果页见分晓。`;

  $("nextRow").classList.remove("hidden");
  $("nextBtn").onclick = () => {
    if (state.idx === QUESTIONS.length - 1) renderResult();
    else { state.idx++; renderQuestion(); }
  };
  document.querySelector(".scroll").scrollTop = document.querySelector(".scroll").scrollHeight;
}

/* ---------- 成就分享卡：苹果风排版（系统字体 / 清晰层级 / 细描边） ---------- */
const CARD_FF = "-apple-system, 'SF Pro Display', 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif";
function setFont(ctx, weight, px) { ctx.font = weight + " " + px + "px " + CARD_FF; }
function setLS(ctx, px) { try { ctx.letterSpacing = px + "px"; } catch (e) {} }   // 字距，旧环境忽略

let _cardReady = false;
function drawCard(score, a, withAvatar = true) {
  const cv = $("cardCanvas");
  if (!cv) return;                       // 已离开结果页（异步回调）则跳过
  const ctx = cv.getContext("2d");
  const W = 1080;
  cv.width = W;
  const cx = W / 2;

  // 先量后画：第一遍只测内容高度，让卡片高度随内容自适应
  const bodyTop = 156;
  const bodyEnd = layoutBody(ctx, W, bodyTop, a, score, false);
  const H = Math.round(bodyEnd + 348);   // 预留底部信息区
  cv.height = H;                          // 设定高度（会清空画布并重置上下文状态）

  // 背景：近白暖色渐变（去掉厚重金边，改极细 hairline，更克制）
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#fffdf9"); g.addColorStop(1, "#fcf4e7");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "#efe4cd"; ctx.lineWidth = 2;
  roundRect(ctx, 16, 16, W - 32, H - 32, 46); ctx.stroke();

  // 第二遍：真正绘制正文（字号已整体加大，弱化留白）
  layoutBody(ctx, W, bodyTop, a, score, true);

  // 底部信息区分割线（hairline）
  const footY = H - 296;
  ctx.textAlign = "center";
  ctx.strokeStyle = "#efe4cd"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(96, footY); ctx.lineTo(W - 96, footY); ctx.stroke();

  // 左：玩家头像 + 昵称
  const avX = 192, avY = footY + 116, avR = 84;
  // 头像底圈
  ctx.save();
  ctx.beginPath(); ctx.arc(avX, avY, avR, 0, Math.PI * 2); ctx.closePath();
  ctx.fillStyle = "#f1e6d0"; ctx.fill();
  let drewImg = false;
  if (withAvatar && state.user && state.user.avatar_url && drawCard._avatarImg && drawCard._avatarImg.complete && drawCard._avatarImg.naturalWidth) {
    try {
      ctx.clip();
      ctx.drawImage(drawCard._avatarImg, avX - avR, avY - avR, avR * 2, avR * 2);
      drewImg = true;
    } catch (e) { drewImg = false; }
  }
  ctx.restore();
  if (!drewImg) {
    // 占位：首字 or 🦆
    ctx.fillStyle = "#b6975f";
    setFont(ctx, 400, 74);
    const initial = (state.user && state.user.name) ? state.user.name.slice(0, 1) : "🦆";
    ctx.fillText(initial, avX, avY + 26);
  }
  // 头像描边
  ctx.strokeStyle = "#e7d8b8"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(avX, avY, avR, 0, Math.PI * 2); ctx.stroke();

  // 昵称：放在头像右侧，垂直居中对齐
  ctx.textAlign = "left";
  ctx.fillStyle = "#4a3a26";
  setFont(ctx, 600, 40);
  const nm = (state.user && state.user.name) ? state.user.name : "匿名鉴定师";
  const nameX = avX + avR + 30;
  const qLeft = W - 104 - 212;                  // 二维码左边界，昵称不可越过
  ctx.fillText(clip(ctx, nm, qLeft - nameX - 36), nameX, avY + 14);

  // 右：二维码（自动读取 /goose-duck/qrcode.png；缺失则显示留白框）
  const qs = 212, qx = W - 104 - qs, qy = footY + 30;
  ctx.fillStyle = "#ffffff";
  roundRect(ctx, qx, qy, qs, qs, 20); ctx.fill();
  if (qrReady && qrImg.naturalWidth) {
    ctx.save();
    roundRect(ctx, qx, qy, qs, qs, 20); ctx.clip();
    ctx.drawImage(qrImg, qx, qy, qs, qs);
    ctx.restore();
    ctx.strokeStyle = "#e7d8b8"; ctx.lineWidth = 3;
    roundRect(ctx, qx, qy, qs, qs, 20); ctx.stroke();
  } else {
    ctx.strokeStyle = "#dccba6"; ctx.setLineDash([10, 9]); ctx.lineWidth = 3;
    roundRect(ctx, qx, qy, qs, qs, 20); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = "#bcae92";
    setFont(ctx, 600, 30);
    ctx.fillText("二维码", qx + qs / 2, qy + qs / 2 - 4);
    setFont(ctx, 400, 24);
    ctx.fillText("敬请期待", qx + qs / 2, qy + qs / 2 + 36);
  }

  // 底部 slogan：整体左移约五个字宽，避开右下角二维码
  ctx.fillStyle = "#a8916a";
  setFont(ctx, 500, 28); setLS(ctx, 1);
  ctx.fillText("扫码也来辨鹅鸭 · 别被骗", cx - 145, H - 54);
  setLS(ctx, 0);

  _cardReady = true;
  exportCardImg(withAvatar);            // 渲染到 <img>，便于微信长按保存
}

/* 正文排版：draw=false 仅测高，draw=true 实际绘制；返回正文底部 y。
   苹果风：系统字体、清晰的字号/字重层级、克制的字距与留白。 */
function layoutBody(ctx, W, startY, a, score, draw) {
  const cx = W / 2;
  const maxTextW = W - 230;
  ctx.textAlign = "center";
  let y = startY;

  // 1) eyebrow 小标签（字距拉开，低调）
  setFont(ctx, 600, 32); setLS(ctx, 6);
  if (draw) { ctx.fillStyle = "#b6975f"; ctx.fillText("鸭骗战争 · 成就榜", cx, y); }
  setLS(ctx, 0);
  y += 72;

  // 2) 装饰 emoji（克制，不喧宾夺主）
  setFont(ctx, 400, 54);
  if (draw) ctx.fillText("🦢  🍗  🦆", cx, y);
  y += 104;

  // 3) 得分标签
  setFont(ctx, 500, 32); setLS(ctx, 2);
  if (draw) { ctx.fillStyle = "#a8916a"; ctx.fillText("本次鉴定得分", cx, y); }
  setLS(ctx, 0);
  y += 160;

  // 4) 大分数（半粗 + 收紧字距，最具份量）
  setFont(ctx, 700, 176); setLS(ctx, -4);
  if (draw) { ctx.fillStyle = "#5a3a16"; ctx.fillText(score + " / 10", cx, y); }
  setLS(ctx, 0);
  y += 74;

  // 5) hairline 短分隔
  if (draw) {
    ctx.strokeStyle = "#ecdfc6"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx - 64, y); ctx.lineTo(cx + 64, y); ctx.stroke();
  }
  y += 74;

  // 6) 奖杯（小）
  setFont(ctx, 400, 50);
  if (draw) ctx.fillText("🏆", cx, y);
  y += 74;

  // 7) 称号（次重点，近黑暖色）
  setFont(ctx, 700, 72); setLS(ctx, 1);
  if (draw) { ctx.fillStyle = "#2f2316"; ctx.fillText(a.t, cx, y); }
  setLS(ctx, 0);
  y += 74;

  // 8) 描述（常规字重，灰棕，自动换行）
  setFont(ctx, 400, 42);
  if (draw) ctx.fillStyle = "#7c6647";
  wrapLines(ctx, a.d, maxTextW).forEach(line => { if (draw) ctx.fillText(line, cx, y); y += 60; });

  // 9) 特点标签
  y += 42;
  setFont(ctx, 600, 29); setLS(ctx, 4);
  if (draw) { ctx.fillStyle = "#c8861a"; ctx.fillText(a.lbl, cx, y); }
  setLS(ctx, 0);
  y += 62;

  // 10) 特点列表
  setFont(ctx, 400, 40);
  if (draw) ctx.fillStyle = "#6f5c41";
  a.f.forEach(line => { if (draw) ctx.fillText("·  " + line, cx, y); y += 60; });

  return y;
}

/* 把离屏 canvas 导出到 <img>：canvas 在微信里无法长按保存，<img> 可以 */
function exportCardImg(withAvatar) {
  const cv = $("cardCanvas"), img = $("cardImg");
  if (!cv || !img) return;
  try {
    img.src = cv.toDataURL("image/png");
  } catch (e) {
    // 头像跨域污染画布 → 去掉头像重绘（withAvatar=false 不会污染，避免死循环）
    if (withAvatar) drawCard(state.correct, ACHIEVEMENTS[state.correct], false);
  }
}

/* 加载头像（CORS）后重绘 */
function loadAvatarThenRedraw() {
  if (!state.user || !state.user.avatar_url) return;
  const im = new Image();
  im.crossOrigin = "anonymous";
  im.referrerPolicy = "no-referrer";
  im.onload = () => { drawCard._avatarImg = im; if (_cardReady) drawCard(state.correct, ACHIEVEMENTS[state.correct]); };
  im.onerror = () => {};
  im.src = state.user.avatar_url;
}

/* ---------- canvas 小工具 ---------- */
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function wrapLines(ctx, text, maxW) {
  const chars = text.split("");
  const lines = [];
  let line = "";
  for (const ch of chars) {
    if (ctx.measureText(line + ch).width > maxW && line) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  return lines;
}
function clip(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 1 && ctx.measureText(t + "…").width > maxW) t = t.slice(0, -1);
  return t + "…";
}

/* ============================================================
   知乎登录（复用现有 /api/auth 接口；弹窗 + 轮询，不改后端）
   ============================================================ */
async function fetchMe() {
  try {
    const r = await fetch("/api/auth/me", { credentials: "include" });
    if (!r.ok) return null;
    const data = await r.json();
    return data && data.user ? data.user : null;
  } catch (e) { return null; }
}

function applyUser(user) {
  state.user = user;
  const chip = $("loginChip"), nm = $("chipName"), av = $("chipAvatar");
  if (user) {
    nm.textContent = user.name || "知乎用户";
    if (user.avatar_url) { av.src = user.avatar_url; av.style.display = "block"; av.referrerPolicy = "no-referrer"; }
    chip.title = "已登录知乎：" + (user.name || "");
    loadAvatarThenRedraw();
    if (_cardReady) drawCard(state.correct, ACHIEVEMENTS[state.correct]);
  } else {
    nm.textContent = "知乎登录";
    av.style.display = "none";
  }
}

let _pollTimer = null, _popup = null;
function startLogin() {
  if (state.user) { toast("已登录：" + state.user.name); return; }
  // next=/goose-duck/ 让登录完成后跳回游戏（而非蒸馏馆 /select）
  _popup = window.open("/api/auth/login?next=" + encodeURIComponent("/goose-duck/"), "zhihu_login", "width=480,height=720");
  toast("请在弹窗中完成知乎登录");
  let tries = 0;
  clearInterval(_pollTimer);
  _pollTimer = setInterval(async () => {
    tries++;
    const user = await fetchMe();
    if (user) {
      clearInterval(_pollTimer);
      applyUser(user);
      toast("登录成功，已写入卡片");
      try { if (_popup && !_popup.closed) _popup.close(); } catch (e) {}
    } else if (tries > 80 || (_popup && _popup.closed)) {
      // 弹窗关闭后再补查一次
      const u2 = await fetchMe();
      if (u2) applyUser(u2);
      clearInterval(_pollTimer);
    }
  }, 1500);
}

// 窗口重新聚焦时兜底复查登录态
window.addEventListener("focus", async () => {
  if (!state.user) { const u = await fetchMe(); if (u) applyUser(u); }
});

$("loginChip").onclick = startLogin;

/* ============================================================
   启动
   ============================================================ */
renderStart();
fetchMe().then(u => { if (u) applyUser(u); });
</script>
